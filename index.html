<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poeziýa Analizatory</title>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --card-bg: #161f38;
            --accent-blue: #0070f3;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --bifurcation: #ff4a4a;
            --success: #00e676;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 15px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 600px; }
        h1 { text-align: center; font-size: 22px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        textarea {
            width: 100%; height: 180px;
            background-color: var(--card-bg);
            border: 1px solid #2d3d66; border-radius: 8px;
            color: #fff; padding: 12px; box-sizing: border-box;
            font-size: 16px; resize: none; outline: none;
        }
        .btn {
            width: 100%; background-color: var(--accent-blue);
            color: white; border: none; padding: 14px;
            border-radius: 8px; font-size: 16px; font-weight: bold;
            margin-top: 10px; cursor: pointer;
        }
        .loading { text-align: center; color: var(--text-muted); display: none; margin: 20px 0; font-size: 14px; }
        .result-card {
            background-color: var(--card-bg); border-radius: 10px;
            padding: 20px; margin-top: 20px; display: none;
        }
        .result-card h3 { margin-top: 0; color: var(--success); border-bottom: 1px solid #2d3d66; padding-bottom: 10px; }
        .summary-text { font-size: 15px; line-height: 1.6; color: #e2e8f0; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 6px; }
        .details-container { margin-top: 20px; }
        .analysis-item { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid var(--bifurcation); }
        .phrase-tag { color: #ff7676; font-weight: bold; font-size: 16px; display: block; margin-bottom: 5px; }
        .analysis-text { font-size: 14px; color: #cbd5e1; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>Şahyrana Ulgam</h1>
    <div class="subtitle">Goşgynyň awtomatiki synergetik analizatory</div>
    
    <textarea id="poemInput" placeholder="Türkmençe goşgy setirlerini şu ýere ýazyň ýa-da goýuň..."></textarea>
    <button class="btn" onclick="startAnalysis()">Derňewi Başlat</button>
    
    <div id="loader" class="loading">⏳ Çuňňur semantik we pelsepewi derňew ýerine ýetirilýär. Garaşyň...</div>

    <div id="resultBox" class="result-card">
        <h3>Synergetik Derňewiň Netijesi</h3>
        <div id="generalEnergy" class="summary-text"></div>
        <div id="analysisDetails" class="details-container"></div>
    </div>
</div>

<script>
async function startAnalysis() {
    const poem = document.getElementById('poemInput').value.trim();
    if(!poem) { alert("Goşgyny giriziň!"); return; }

    const loader = document.getElementById('loader');
    const resultBox = document.getElementById('resultBox');
    loader.style.display = 'block';
    resultBox.style.display = 'none';

    try {
        // Запрос идет на наш собственный сервер Vercel, VPN пользователю НЕ НУЖЕН
        const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ poem: poem })
        });

        if (!response.ok) { throw new Error('Näsazlyk'); }

        const result = await response.json();

        document.getElementById('generalEnergy').innerText = result.summary;
        
        let detailsHtml = '';
        result.details.forEach(item => {
            detailsHtml += `
                <div class="analysis-item">
                    <span class="phrase-tag">«${item.phrase}»</span>
                    <div class="analysis-text">${item.analysis}</div>
                </div>`;
        });
        
        document.getElementById('analysisDetails').innerHTML = detailsHtml;
        resultBox.style.display = 'block';
    } catch (error) {
        alert("Näsazlyk ýüze çykdy. Biraz wagtdan gaýtadan barlap görüň.");
    } finally {
        loader.style.display = 'none';
    }
}
</script>
</body>
</html>
